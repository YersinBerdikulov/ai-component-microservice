[project]
name = "ai-microservice"
version = "1.0.0"
description = "AI microservice for an educational data analysis simulator"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
# Explicit rule set so CI results do not change when ruff's defaults change
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]       # load_dotenv() must run before app imports read env vars
"app/prompts/*" = ["E501"]     # long natural-language prompt lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
