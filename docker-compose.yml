version: "3.9"

services:
  ai-service:
    build: .
    ports:
      - "8100:8100"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
