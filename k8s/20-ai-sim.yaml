# Experiment settings (provider, model) live in Git, next to the code.
# API keys go into an optional Secret that is never committed:
#   kubectl -n ai-sim create secret generic ai-sim-secrets --from-env-file=.env
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sim-config
  namespace: ai-sim
data:
  DEFAULT_LLM_PROVIDER: openai
  DEFAULT_MODEL: gpt-4o-mini
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: INFO
  PILOT_LOG_PATH: logs/pilot_events.jsonl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sim
  namespace: ai-sim
  labels:
    app: ai-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-sim
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # keep serving during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-sim
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: ai-sim
          # The Jenkins pipeline replaces this with the build tag (<build>-<commit>)
          image: ai-sim-service:latest
          # The image is loaded into the Minikube node directly, there is no registry
          imagePullPolicy: Never
          ports:
            - containerPort: 8100
          envFrom:
            - configMapRef:
                name: ai-sim-config
            - secretRef:
                name: ai-sim-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      # Test environment: the model is retrained on first use and pilot events are
      # kept per pod. A real pilot run would mount a PersistentVolume for logs/.
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
