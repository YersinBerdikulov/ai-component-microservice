name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check app tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # pinned numpy 2.5 requires Python >= 3.12
    services:
      # Real Redis so the cache and chat-history code paths run as in production
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DEFAULT_LLM_PROVIDER: openai   # LLM calls are mocked; no API keys needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term --cov-report=xml --junitxml=test-results.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml

  docker:
    name: Docker build, smoke test & publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalise image name (registry requires lowercase)
        run: echo "IMAGE=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Smoke test /health
        run: |
          docker run -d --name ai-service -p 8100:8100 $IMAGE:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8100/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs ai-service
          exit 1

      - name: Smoke test /predict (ML model, no LLM)
        run: |
          curl -fs -X POST http://localhost:8100/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"student_data":[{"student_id":"s1","attendance_rate":0.2,"assignment_completion":0.1,"avg_grade":20,"forum_posts":0,"time_on_platform":1,"late_submissions":15}]}'

      # CD: publish the image only for pushes to the default branch or version tags
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag $IMAGE:${{ github.sha }} $IMAGE:${GITHUB_REF#refs/tags/}
          fi
          docker push --all-tags $IMAGE
